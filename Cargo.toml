[package]
name = "sbx"
version = "0.3.1"
edition = "2021"
rust-version = "1.97"
description = "Seccomp + Landlock sandbox launcher for running untrusted programs in serverless containers"
license = "Apache-2.0"

[dependencies]
landlock = "0.4.7"
seccompiler = "0.5"
libc = "0.2.170"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
